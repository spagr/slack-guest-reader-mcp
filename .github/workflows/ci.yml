name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan full git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --redact .

  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q

  emulator:
    name: Firestore emulator tests
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8681
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group dev
      - uses: actions/setup-java@v4  # the emulator needs a Java 21+ JRE on PATH
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator
      - name: Start the Firestore emulator
        run: |
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" \
            --database-mode=firestore-native --project=emulator-test > emulator.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "http://$FIRESTORE_EMULATOR_HOST/" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat emulator.log; echo "emulator did not start"; exit 1
      - name: Pytest (emulator-marked tests only, none may be skipped)
        run: |
          set -o pipefail
          uv run pytest -q -m emulator -rs 2>&1 | tee pytest.log
          if grep -Eq "^SKIPPED| skipped" pytest.log; then echo "emulator tests were skipped"; exit 1; fi

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck scripts/*.sh
        run: shellcheck --version && shellcheck -x scripts/*.sh
