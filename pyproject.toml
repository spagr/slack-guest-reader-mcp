[project]
name = "slack-guest-reader-mcp"
version = "0.1.0"
description = "Read-only remote MCP server for a handful of Slack channels in a workspace you don't own."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "google-cloud-firestore>=2.19,<3",
    "py-key-value-aio[firestore,wrappers-encryption]>=0.4,<1",
    "uvicorn>=0.30",
]

[project.scripts]
slack-guest-reader = "slack_guest_reader.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_guest_reader"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S105", "S106"]  # asserts and literal "secret" names are fine in tests/placeholders

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["slack_guest_reader"]
mypy_path = "src"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
